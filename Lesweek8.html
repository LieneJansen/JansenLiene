<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesweek 8 | Projectdocumentatie PRTT</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background-image: url('achtergrondfoto.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.45);
            min-height: 100vh;
            padding-top: 90px;
            display: flex;
            justify-content: center;
        }

        .glass-box {
            background: rgba(209, 199, 252, 0.95);
            backdrop-filter: blur(6px);
        }

        .nav-link:hover {
            color: #c4b5fd;
        }

        .active {
            color: #facc15;
            font-weight: 700;
        }

        .zoom-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .zoom-overlay img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 1rem;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<header class="fixed top-0 left-0 w-full z-50 bg-purple-900 bg-opacity-90 text-white">
    <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
        <a href="index.html" class="text-xl font-bold">PRTT</a>

        <nav class="hidden md:flex space-x-6 text-lg">
            <a href="index.html" class="nav-link">Home</a>
            <a href="Lesweek1.html" class="nav-link">Week 1</a>
            <a href="Lesweek2.html" class="nav-link">Week 2</a>
            <a href="Lesweek3.html" class="nav-link">Week 3</a>
            <a href="Lesweek4.html" class="nav-link">Week 4</a>
            <a href="Lesweek5.html" class="nav-link">Week 5</a>
            <a href="Lesweek6.html" class="nav-link">Week 6</a>
            <a href="Lesweek7.html" class="nav-link">Week 7</a>
            <a href="Lesweek8.html" class="nav-link">Week 8</a>
            <a href="Lesweek9.html" class="nav-link">Week 9</a>
            <a href="Lesweek10.html" class="nav-link">Week 10</a>
            <a href="Lesweek11.html" class="nav-link">Week 11</a>
            <a href="Lesweek12.html" class="nav-link">Week 12</a>
            <a href="Lesweek13.html" class="nav-link">Week 13</a>
        </nav>

        <button id="menu-btn" class="md:hidden text-3xl">☰</button>
    </div>
</header>

<div id="menu-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40"></div>

<nav id="mobile-menu"
     class="fixed top-0 left-0 h-full w-64 bg-purple-800 text-white transform -translate-x-full transition-transform duration-300 z-50 p-6 space-y-4">
    <a href="index.html" class="nav-link block">Home</a>
    <a href="Lesweek8.html" class="nav-link block">Lesweek 8</a>
</nav>

<!-- CONTENT -->
<div class="overlay">
    <main class="glass-box max-w-5xl w-full rounded-3xl shadow-2xl p-10 space-y-8 text-center">

        <h1 class="text-4xl font-bold text-purple-900">
            Lesweek 8 – Examens
        </h1>

        <!-- NAAM ONDER DE TITEL -->
        <p class="text-lg text-gray-800 text-center font-medium mb-6">
            Jansen Liene - 1GDM2
        </p>

        <section class="flex flex-col items-center gap-6">
            <img src="examen.png" class="zoomable w-72 rounded-xl shadow-lg cursor-pointer" alt="Examen afbeelding">

            <p class="text-purple-800">
                Deze week stond volledig in het teken van de examens.
            </p>
        </section>

    </main>
</div>

<script>
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const overlay = document.getElementById('menu-overlay');

    menuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
    });

    overlay.addEventListener('click', () => {
        mobileMenu.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
    });

    const links = document.querySelectorAll('.nav-link');
    const currentPage = window.location.pathname.split('/').pop();
    links.forEach(link => {
        if (link.getAttribute('href') === currentPage) {
            link.classList.add('active');
        }
    });

    document.querySelectorAll('.zoomable').forEach(img => {
        img.addEventListener('click', () => {
            const overlay = document.createElement('div');
            overlay.className = 'zoom-overlay';
            const zoomImg = document.createElement('img');
            zoomImg.src = img.src;
            overlay.appendChild(zoomImg);
            document.body.appendChild(overlay);
            overlay.addEventListener('click', () => overlay.remove());
        });
    });
</script>

</body>
</html>
